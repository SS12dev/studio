[project]
name = "studio"
version = "0.0.1"
description = "Local photo-first subject + pose generation app (phase 0)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlmodel>=0.0.22",
    "numpy>=1.26,<2.3",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "scikit-learn>=1.5",
    "psutil>=6.0",
]

[project.optional-dependencies]
# Face sorting stack (phase 1a). insightface builds a small C extension on install.
faces = [
    "insightface>=0.7.3",
    "onnxruntime>=1.19",
    "opencv-python-headless>=4.10",
]
# Camera RAW decoding.
raw = ["rawpy>=0.22"]
# Apple Silicon ML runtimes, used by later bake-offs.
mac = [
    "torch>=2.5",
    "mlx>=0.20; sys_platform == 'darwin'",
]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/studio"]

[project.scripts]
studio-check = "studio.envcheck:main"
studio-faces = "studio.faces.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
