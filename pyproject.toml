[project]
name = "studio"
version = "0.0.1"
description = "Local photo-first subject + pose generation app (phase 0)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlmodel>=0.0.22",
    "numpy>=1.26,<2.3",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "scikit-learn>=1.5",
    "psutil>=6.0",
    "python-multipart>=0.0.9",
]

# Optional stacks as dependency groups. `default-groups = "all"` (below) makes a plain
# `uv sync` / `uv run` install every group, so nothing gets dropped by accident.
[dependency-groups]
# Face sorting stack (phase 1a). insightface brings opencv-python; do not add the headless build too.
faces = [
    "insightface>=0.7.3",
    "onnxruntime>=1.19",
]
# Camera RAW decoding.
raw = ["rawpy>=0.22"]
# Apple Silicon ML runtimes, used by later bake-offs.
mac = [
    "torch>=2.5",
    "mlx>=0.20; sys_platform == 'darwin'",
]
# Extraction bake-off: matting, depth, albedo candidates.
extract = [
    "transformers>=4.46",
    "diffusers>=0.33",
    "accelerate>=1.0",
    "torchvision>=0.20",
    "timm>=1.0",
    "kornia>=0.7",
    "einops>=0.8",
    "huggingface_hub>=0.26",
]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx2>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/studio"]

[project.scripts]
studio = "studio.cli:main"
studio-check = "studio.envcheck:main"
studio-faces = "studio.faces.cli:main"
studio-bakeoff = "studio.bakeoff.cli:main"

[tool.uv]
default-groups = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
